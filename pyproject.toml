[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-mail-cli"
version = "0.1.0"
description = "中国科学技术大学邮箱命令行工具"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
ustc-mail = "ustc_mail:main"

[tool.setuptools]
py-modules = ["ustc_mail"]
